[package]

name = "mars-data"
version = "0.1.4"
authors = ["Conor Forde"]
rust-version = "1.96.0"
edition = '2024'
license = "MIT"
default-run = "marsdata"
repository = "https://www.github.com/Snowda/Mars-Data"

description = "Mars weather data parser"
keywords = ["mars", "planet", "data"]

[[bin]]
name = "marsdata"
path = "src/main.rs"

[features]
default = ["std"]
std = []
integration_tests = []

[dependencies]

# Astro data
astro = "2.0.0"

# JSON
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

# Config
toml = "1.1"

# Networking
# rustls-no-provider: reqwest 0.13's `rustls` feature pulls the aws-lc-rs provider
# (needs a C toolchain); we select the pure-Rust ring provider ourselves to keep
# builds hermetic and cross-compilable. See the CryptoProvider install in weather.rs.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "gzip", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Web framework
axum = "0.8"

# Threading
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

# Time library
jiff = { version = "0.2", features = ["serde"] }

# Stack-allocated strings and vecs with known bounds
arrayvec = { version = "0.7", features = ["serde"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.dev]
# line tables keep backtraces while avoiding the cost of generating + linking full debuginfo
debug = "line-tables-only"
opt-level = 0

[lints.rust]
# No unsafe anywhere in the tree (forbid blocks even a local #[allow] opt-in).
unsafe_code = "forbid"

[lints.clippy]
# Reconcile clippy defaults with the project's explicit-return convention.
needless_return = "allow"

# Complexity lints (allow-by-default in clippy's nursery/pedantic groups).
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
excessive_nesting = "warn"
# Panic-macro and stray-stdio bans (CLI bins re-opt-in with a scoped #[allow]).
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Complexity / maintainability signals.
missing_const_for_fn = "warn"
too_long_first_doc_paragraph = "warn"
# No unwrap/expect in application code (tests re-opt-in via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
# A held lock (std or parking_lot) across an .await is a deadlock risk.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Explicit imports over glob imports.
wildcard_imports = "warn"
# Flag lossy/silent numeric casts.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
cast_precision_loss = "warn"
# Avoid needless clones.
redundant_clone = "warn"
clone_on_ref_ptr = "warn"

[profile.coverage]
inherits = "dev"
opt-level = 0
debug = false

[profile.coverage.package."*"]
opt-level = 0
debug = false
